<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | MoveFleet</title><link rel="icon" href="assets/img/favicon.png"><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="auth-page"><div class="auth-tools"><button class="iconbtn" data-theme aria-label="Toggle dark theme" title="Switch colour theme">◐</button><button class="iconbtn" data-dir aria-label="Toggle RTL" title="Switch text direction">⇄</button></div><section class="auth-card"><div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark">MF</span><span>MoveFleet<small>MINI TRUCK & TEMPO BOOKING</small></span></a></div><h1>Welcome back</h1><p class="auth-sub">Sign in to manage bookings, track trips and view billing.</p><form data-login-form><div class="field"><label for="loginEmail">Email address</label><input class="auth-input" id="loginEmail" type="email" required placeholder="Enter your email"></div><div class="field"><label for="loginPassword">Password</label><input class="auth-input" id="loginPassword" type="password" required placeholder="Enter your password"></div><div class="auth-row"><label class="remember"><input type="checkbox"> Remember me</label><a class="forgot" href="mailto:support@movefleet.example?subject=Password%20reset">Forgot password?</a></div><button class="btn auth-submit">Sign In</button></form><div class="or">Or continue with</div><div class="social-login"><button type="button" data-social-login><span class="social-brand google-brand" aria-hidden="true">G</span> Google</button><button type="button" data-social-login><span class="social-brand apple-brand" aria-hidden="true">&#xf179;</span> Apple</button></div><p class="auth-bottom">New to MoveFleet? <a href="signup.html">Create an account</a></p><p class="auth-bottom"><a href="index.html">← Back to website</a></p></section></main><script src="assets/js/app.js"></script><script>if(localStorage.getItem('mf-theme')==='dark')document.querySelector('.auth-page').classList.add('dark');document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>document.querySelector('.auth-page').classList.toggle('dark')));</script></body></html>
