<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up | MoveFleet</title><link rel="icon" href="assets/img/favicon.png"><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="auth-page"><div class="auth-tools"><button class="iconbtn theme-control" data-theme aria-label="Toggle dark theme" title="Switch colour theme">◐</button><button class="iconbtn rtl-control" data-dir aria-label="Toggle RTL" title="Switch text direction">⇄</button></div><section class="auth-card"><div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark">MF</span><span>MoveFleet<small>MINI TRUCK & TEMPO BOOKING</small></span></a></div><h1>Create your account</h1><p class="auth-sub">Register to book vehicles and manage your trips.</p><form data-signup-form><div class="field"><label for="fullName">Full name</label><input class="auth-input" id="fullName" required placeholder="Enter your name"></div><div class="field"><label for="signupEmail">Email address</label><input class="auth-input" id="signupEmail" type="email" required placeholder="name@example.com"></div><div class="field"><label for="signupPhone">Phone number</label><input class="auth-input" id="signupPhone" type="tel" required placeholder="Your mobile number"></div><div class="field"><label for="signupPassword">Create password</label><input class="auth-input" id="signupPassword" type="password" required minlength="6" placeholder="At least 6 characters"></div><label class="terms"><input type="checkbox" id="terms"><span>I agree to the <a href="#" style="color:#07539a;font-weight:800">Terms & Conditions</a> and Privacy Policy.</span></label><button class="btn auth-submit">Create Account</button></form><div class="or">Or continue with</div><div class="social-login"><button type="button" data-social-login><span class="social-brand google-brand" aria-hidden="true">G</span> Google</button><button type="button" data-social-login><span class="social-brand apple-brand" aria-hidden="true">&#xf179;</span> Apple</button></div><p class="auth-bottom">Already have an account? <a href="login.html">Sign in</a></p><p class="auth-bottom"><a href="index.html">← Back to website</a></p></section></main><script src="assets/js/app.js"></script><script>if(localStorage.getItem('mf-theme')==='dark')document.querySelector('.auth-page').classList.add('dark');document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>document.querySelector('.auth-page').classList.toggle('dark')));</script></body></html>
